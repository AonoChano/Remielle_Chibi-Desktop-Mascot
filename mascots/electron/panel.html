<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remielle Control Panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo" data-i18n="app.title">小蕾米</div>
      <nav>
        <a href="#" class="nav-item active" data-tab="main" data-i18n="nav.main">主面板</a>
        <a href="#" class="nav-item" data-tab="settings" data-i18n="nav.settings">设置</a>
        <a href="#" class="nav-item" data-tab="about" data-i18n="nav.about">关于</a>
      </nav>
    </aside>
    <main class="content">
      <section id="tab-main" class="tab active">
        <!-- 未来正式功能加在这里（复选框上方），当前留白 -->

        <div class="setting-row">
          <label class="checkbox-label">
            <input type="checkbox" id="test-mode-toggle">
            <span data-i18n="testMode.label">进行动画控制测试</span>
          </label>
        </div>

        <div id="test-controls" style="display:none;">
          <h2 data-i18n="anim.title">动画播放</h2>
          <div class="button-grid">
            <button class="btn-anim active" data-anim="a" data-i18n="anim.idle">待机 Idle</button>
            <button class="btn-anim" data-anim="b" data-i18n="anim.thinking">思考 Thinking</button>
            <button class="btn-anim" data-anim="d" data-i18n="anim.drawing">疯狂画画 Drawing</button>
            <button class="btn-anim" data-anim="c" data-i18n="anim.finished">画完炫耀 Finished</button>
            <button class="btn-anim" data-anim="d_win" data-i18n="anim.done">画完收笔 Done</button>
            <button class="btn-anim" data-anim="e" data-i18n="anim.tearingUp">委屈 Tearing Up</button>
            <button class="btn-anim" data-anim="a_win" data-i18n="anim.ready">拿起画笔 Ready</button>
          </div>

          <div class="setting-row">
            <label class="checkbox-label">
              <input type="checkbox" id="light-toggle">
              <span data-i18n="anim.goldenLight">金色光芒 Golden Light</span>
            </label>
          </div>

          <h2 data-i18n="outfit.title">换装</h2>
          <div class="button-grid">
            <button class="btn-outfit locked" data-outfit="A" data-i18n="outfit.suitA">套装 A</button>
            <button class="btn-outfit" data-outfit="B" data-i18n="outfit.suitB">套装 B</button>
            <button class="btn-outfit" data-outfit="C" data-i18n="outfit.suitC">套装 C</button>
            <button class="btn-outfit" data-outfit="D" data-i18n="outfit.suitD">套装 D</button>
            <button class="btn-outfit" data-outfit="E" data-i18n="outfit.suitE">套装 E</button>
          </div>
        </div>
      </section>

      <section id="tab-settings" class="tab">
        <h2 data-i18n="settings.title">设置</h2>
        <div class="setting-row">
          <label data-i18n="settings.size">角色尺寸</label>
          <select id="size-select">
            <option value="240" data-i18n="settings.sizeSmall">小 — 240px</option>
            <option value="320" data-i18n="settings.sizeMedium">中 — 320px</option>
            <option value="420" selected data-i18n="settings.sizeDefault">默认 — 420px</option>
            <option value="560" data-i18n="settings.sizeLarge">大 — 560px</option>
            <option value="640" data-i18n="settings.sizeXLarge">特大 — 640px</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="settings.language">界面语言</label>
          <select id="locale-select">
            <!-- 动态填充 -->
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="settings.alwaysOnTop">窗口置顶</label>
          <span class="hint" data-i18n="settings.alwaysOnTopHint">桌宠窗口始终保持在最上层</span>
        </div>
        <div class="setting-row">
          <label data-i18n="settings.autoStart">开机自启</label>
          <span class="hint" data-i18n="settings.autoStartHint">暂未实现</span>
        </div>
      </section>

      <section id="tab-about" class="tab">
        <div class="about-panel">
          <!-- Top bar: identity left, social right -->
          <div class="about-topbar">
            <div class="about-identity">
              <img class="about-avatar" src="https://avatars.githubusercontent.com/u/81866991?v=4" alt="AonoChano" crossorigin="anonymous">
              <div class="about-info">
                <h3 data-i18n="about.authorName">Watanabe Satoru</h3>
                <p class="about-handle">@AonoChano</p>
                <p class="about-location" data-i18n="about.locationValue">中国</p>
              </div>
            </div>
            <div class="about-social">
              <a href="https://github.com/AonoChano" target="_blank" class="social-link">
                <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                <span>github.com/AonoChano</span>
              </a>
            </div>
          </div>

          <div class="about-divider"></div>

          <div class="about-section">
            <h4 data-i18n="about.appName">Remielle Desktop Mascot</h4>
            <p class="about-version" data-i18n="about.versionValue">v0.1.0</p>
            <p class="about-desc" data-i18n="about.description">基于 Spine 2D 骨骼动画的桌面桌宠应用框架。</p>
          </div>

          <div class="about-section">
            <h4 data-i18n="about.credits">致谢</h4>
            <ul class="about-credits">
              <li data-i18n="about.creditHoyoverse">miHoYo / HoYoverse — 角色设计与《绝区零》</li>
              <li data-i18n="about.creditSpine">Esoteric Software — Spine 2D 动画引擎</li>
              <li data-i18n="about.creditElectron">Electron — 跨平台桌面应用框架</li>
            </ul>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="panel.js"></script>
</body>
</html>
