<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>About Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #faf7f9; color: #5a4568; overflow: hidden; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 200px; background: linear-gradient(180deg, #1a0a2e 0%, #2d1050 50%, #1a0a2e 100%); color: #d8cce8; display: flex; flex-direction: column; flex-shrink: 0; }
    .logo { padding: 20px 16px 16px; text-align: center; border-bottom: 1px solid rgba(194, 24, 91, 0.2); }
    .logo-img { display: block; width: 100%; max-width: 168px; margin: 0 auto 8px; image-rendering: auto; }
    .logo-label { display: block; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; background: linear-gradient(135deg, #C2185B, #FF4081, #F48FB1); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    nav { padding: 12px 0; }
    .nav-item { display: block; padding: 12px 24px; color: #a898c8; text-decoration: none; font-size: 14px; transition: all 0.2s; border-left: 3px solid transparent; }
    .nav-item.active { background: rgba(255, 64, 129, 0.1); color: #F48FB1; border-left-color: #E91E63; }
    .content { flex: 1; padding: 24px; overflow-y: auto; }
    .tab { display: none; }
    .tab.active { display: block; }
    h2 { margin-bottom: 16px; font-size: 18px; color: #5a3e68; font-weight: 600; }

    .about-panel { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 1px 4px rgba(140, 100, 160, 0.06); }
    .about-topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .about-identity { display: flex; align-items: center; gap: 14px; }
    .about-avatar { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #d8c8e8; }
    .about-info h3 { margin: 0 0 2px 0; font-size: 16px; color: #3a2848; }
    .about-handle { margin: 0 0 2px 0; font-size: 13px; color: #a080b8; }
    .about-location { margin: 0; font-size: 12px; color: #c0a8d0; }
    .about-social { text-align: right; }
    .social-link { display: inline-flex; align-items: center; gap: 6px; color: #a080b8; text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .social-link:hover { color: #E91E63; }
    .social-icon { width: 18px; height: 18px; }
    .about-divider { height: 1px; background: #f0e8f5; margin: 22px 0; }
    .about-section { margin-bottom: 20px; }
    .about-section:last-child { margin-bottom: 0; }
    .about-section h4 { margin: 0 0 6px 0; font-size: 15px; color: #3a2848; }
    .about-version { margin: 0 0 6px 0; font-size: 13px; color: #c0a8d0; }
    .about-desc { margin: 0; font-size: 14px; color: #6a5880; line-height: 1.7; }
    .about-credits { list-style: none; padding: 0; margin: 0; }
    .about-credits li { padding: 5px 0; font-size: 13px; color: #5a4568; border-bottom: 1px solid #f0e8f5; }
    .about-credits li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <img class="logo-img" src="assets/BannerLogo.png" alt="Remielle">
        <span class="logo-label">控制面板</span>
      </div>
      <nav>
        <a href="#" class="nav-item">主面板</a>
        <a href="#" class="nav-item">设置</a>
        <a href="#" class="nav-item active">关于</a>
      </nav>
    </aside>
    <main class="content">
      <section id="tab-about" class="tab active">
        <div class="about-panel">
          <div class="about-topbar">
            <div class="about-identity">
              <img class="about-avatar" src="https://avatars.githubusercontent.com/u/81866991?v=4" alt="AonoChano" crossorigin="anonymous">
              <div class="about-info">
                <h3>Watanabe Satoru</h3>
                <p class="about-handle">@AonoChano</p>
                <p class="about-location">中国</p>
              </div>
            </div>
            <div class="about-social">
              <a href="https://github.com/AonoChano" target="_blank" class="social-link">
                <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                <span>github.com/AonoChano</span>
              </a>
            </div>
          </div>
          <div class="about-divider"></div>
          <div class="about-section">
            <h4>Remielle Desktop Mascot</h4>
            <p class="about-version">v0.1.0</p>
            <p class="about-desc">基于 Spine 2D 骨骼动画的桌面桌宠应用框架。</p>
          </div>
          <div class="about-section">
            <h4>致谢</h4>
            <ul class="about-credits">
              <li>miHoYo / HoYoverse — 角色设计与《绝区零》</li>
              <li>Esoteric Software — Spine 2D 动画引擎</li>
              <li>Electron — 跨平台桌面应用框架</li>
            </ul>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
