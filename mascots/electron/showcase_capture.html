<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
html, body { width: 400px; height: 400px; overflow: hidden; background: #ff00ff; }
#canvas { display: block; width: 400px; height: 400px; }
</style>
</head>
<body>
<canvas id="canvas" width="400" height="400"></canvas>
<script src="./node_modules/@esotericsoftware/spine-webgl/dist/iife/spine-webgl.js"></script>
<script>
const { ipcRenderer } = require('electron');

class ShowcaseCaptureApp {
  constructor() {
    this.skeleton = null;
    this.animationState = null;
  }

  loadAssets(canvas) {
    canvas.assetManager.loadText("assets/remi.json");
    canvas.assetManager.loadTextureAtlas("assets/leimi.atlas");
  }

  initialize(canvas) {
    let assetManager = canvas.assetManager;
    var atlas = assetManager.require("assets/leimi.atlas");
    var atlasLoader = new spine.AtlasAttachmentLoader(atlas);
    var skeletonJson = new spine.SkeletonJson(atlasLoader);
    skeletonJson.scale = 1;
    var skeletonData = skeletonJson.readSkeletonData(assetManager.require("assets/remi.json"));
    this.skeleton = new spine.Skeleton(skeletonData);

    var animationStateData = new spine.AnimationStateData(skeletonData);
    this.animationState = new spine.AnimationState(animationStateData);

    // List all available animations
    var animNames = skeletonData.animations.map(a => a.name);
    console.log('ANIMS:' + JSON.stringify(animNames));

    this.skeleton.setToSetupPose();
    this.skeleton.updateWorldTransform(spine.Physics.update);

    ipcRenderer.send('capture-ready');
  }

  playAnimation(animName) {
    if (this.animationState && this.skeleton) {
      this.animationState.clearTracks();
      this.skeleton.setToSetupPose();
      this.animationState.setAnimation(0, animName, true);
    }
  }

  update(canvas, delta) {
    if (this.animationState) {
      this.animationState.update(delta);
      this.animationState.apply(this.skeleton);
    }
    if (this.skeleton) {
      this.skeleton.updateWorldTransform(spine.Physics.update);
    }
  }

  render(canvas) {
    let renderer = canvas.renderer;
    renderer.resize(spine.ResizeMode.Expand);
    // Clear with magenta (chroma key background)
    canvas.clear(1, 0, 1, 1);
    renderer.begin();
    if (this.skeleton) {
      renderer.drawSkeleton(this.skeleton, false);
    }
    renderer.end();
  }
}

const app = new ShowcaseCaptureApp();
new spine.SpineCanvas(document.getElementById("canvas"), {
  app: app,
  webglConfig: { alpha: true, premultipliedAlpha: false }
});

ipcRenderer.on('play-animation', (event, animName) => {
  app.playAnimation(animName);
});
</script>
</body>
</html>
